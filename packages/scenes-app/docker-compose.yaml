services:
  grafana:
    container_name: 'grafana-scenes-app'
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana}
        grafana_version: ${GRAFANA_VERSION:-13.2.4}
    ports:
      - 3001:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-scenes-app
      - ./provisioning:/etc/grafana/provisioning
      - ./provisioning/custom.ini:/etc/grafana/grafana.ini

  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    volumes:
      - ./provisioning/prometheus:/etc/prometheus
